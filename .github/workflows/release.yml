name: Create release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build resource
        run: bun run build
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}
      - name: Bundle FXServer resource
        run: |
          mkdir -p ./temp/oxmysql/{web,lib}
          cp ./{LICENSE,README.md,fxmanifest.lua,ui.lua} ./temp/oxmysql/
          cp ./lib/MySQL.lua ./temp/oxmysql/lib/
          cp -r ./dist ./logger ./temp/oxmysql/
          cp -r ./web/build ./temp/oxmysql/web/
          cd ./temp && zip -r ../oxmysql.zip ./oxmysql
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: oxmysql.zip
          generate_release_notes: true
