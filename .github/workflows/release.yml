name: Release oxpg (FiveM resource)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example v1.0.0)
        required: true
        default: v1.0.0
        type: string

permissions: {}

concurrency:
  group: oxpg-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish FiveM resource
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release tag and source commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$RELEASE_TAG'. Expected vX.Y.Z."
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"

          if [[ "$tag_commit" != "$checked_out_commit" ]]; then
            echo "::error::Checked out commit does not match $RELEASE_TAG."
            exit 1
          fi

          echo "Preparing $RELEASE_TAG from $checked_out_commit"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-

      - name: Install dependencies
        run: bun install --no-save

      - name: Run unit tests
        run: bun run test

      - name: Build resource
        run: bun run build
        env:
          TGT_RELEASE_VERSION: ${{ env.RELEASE_TAG }}

      - name: Package FiveM resource
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/oxpg-release/oxmysql"
          archive="$GITHUB_WORKSPACE/oxmysql.zip"

          rm -rf "$RUNNER_TEMP/oxpg-release" "$archive"
          mkdir -p "$package_dir/lib" "$package_dir/web"

          cp LICENSE README.md fxmanifest.lua ui.lua "$package_dir/"
          cp -a dist logger "$package_dir/"
          cp -a lib/MySQL.lua "$package_dir/lib/"
          cp -a web/build "$package_dir/web/"

          command -v zip >/dev/null
          command -v unzip >/dev/null

          # Run zip from inside the resource folder so every entry is rooted at
          # fxmanifest.lua, not inside an extra oxmysql/ parent directory.
          (
            cd "$package_dir"
            zip -q -r -X "$archive" \
              fxmanifest.lua LICENSE README.md ui.lua dist lib logger web
          )

          test -s "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Verify release archive layout
        shell: bash
        run: |
          set -euo pipefail

          entries="$(unzip -Z1 oxmysql.zip)"

          for required in \
            fxmanifest.lua \
            LICENSE \
            README.md \
            ui.lua \
            dist/build.js \
            lib/MySQL.lua \
            logger/fivemanage.js \
            web/build/index.html; do
            if ! grep -Fxq "$required" <<< "$entries"; then
              echo "::error::Release archive is missing root entry: $required"
              exit 1
            fi
          done

          if grep -Eq '^(\./)?oxmysql/' <<< "$entries"; then
            echo "::error::Release archive contains an unwanted oxmysql/ parent directory."
            exit 1
          fi

          if ! grep -Eq '^web/build/assets/[^/]+$' <<< "$entries"; then
            echo "::error::Release archive is missing built web assets."
            exit 1
          fi

          echo "Verified root-level FiveM resource layout:"
          printf '%s\n' "$entries" | head -40

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: oxpg ${{ env.RELEASE_TAG }}
          files: |
            oxmysql.zip
            oxmysql.zip.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
